version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar-backend
    ports:
      - "8085:8085"
    environment:
      - H2_PASSWORD=${H2_PASSWORD:-apaar_local_db}
    volumes:
      - apaar-data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apaar-frontend
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend
    restart: always

volumes:
  apaar-data:
