# ==============================================================================
# AICTE APAAR Platform - Spring Boot Configuration
# Default Database: PostgreSQL (Port 5433 local, or Railway/Cloud env vars)
# ==============================================================================

server.port=${PORT:8085}
spring.application.name=apaar-verify-backend

# PostgreSQL Connection Settings (Supports Railway PGHOST/PGUSER/PGPASSWORD or standard DB_URL/POSTGRES_*)
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:${PGHOST:localhost}}:${POSTGRES_PORT:${PGPORT:5433}}/${POSTGRES_DB:${PGDATABASE:apaardb}}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:Ravan#666}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Super Admin credentials (used by POST /api/auth/admin-login)
apaar.admin.email=${APAAR_ADMIN_EMAIL:admin@aicte.gov.in}
apaar.admin.password=${APAAR_ADMIN_PASSWORD:Aicte@2026}

# CORS origins (Accepts wildcard or comma-separated domains from APP_ALLOWED_ORIGINS)
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:*}

# Kafka Broker Configuration (optional event publishing; platform works without a broker)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=0
spring.kafka.producer.acks=1
aicte.kafka.duplicate-topic=aicte.apaar.duplicate-events

# Logging
logging.level.gov.aicte=INFO
logging.level.org.springframework.security=WARN
