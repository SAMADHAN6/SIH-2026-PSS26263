# Spring Boot Configuration - AICTE APAAR Platform
server.port=8085

# Application Details
spring.application.name=apaar-verify-backend

# H2 File Database - records persist across restarts (stored in ./data)
spring.datasource.url=jdbc:h2:file:./data/apaardb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:apaar_local_db}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Super Admin credentials (used by POST /api/auth/admin-login)
apaar.admin.email=${APAAR_ADMIN_EMAIL:admin@aicte.gov.in}
apaar.admin.password=${APAAR_ADMIN_PASSWORD:Aicte@2026}

# Local development CORS. Production must set an explicit frontend origin.
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200}

# Kafka Broker Configuration (optional event publishing; platform works without a broker)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=0
spring.kafka.producer.acks=1
aicte.kafka.duplicate-topic=aicte.apaar.duplicate-events

# Logging
logging.level.gov.aicte=INFO
logging.level.org.springframework.security=WARN
