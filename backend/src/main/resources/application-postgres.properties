# Spring Boot PostgreSQL Profile
# Activate with: --spring.profiles.active=postgres or SPRING_PROFILES_ACTIVE=postgres

server.port=8085
spring.application.name=apaar-verify-backend

# PostgreSQL Connection Settings
# Supports environment variables DB_URL or individual POSTGRES_* overrides, defaulting to local port 5433
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:apaardb}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:Ravan#666}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 console is disabled when on PostgreSQL
spring.h2.console.enabled=false

# Kafka Event Broker Configuration
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
aicte.kafka.duplicate-topic=aicte.apaar.duplicate-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Logging
logging.level.gov.aicte=INFO
logging.level.org.springframework.security=WARN
