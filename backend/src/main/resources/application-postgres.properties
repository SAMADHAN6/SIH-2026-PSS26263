# PostgreSQL production profile
# Activate with:  SPRING_PROFILES_ACTIVE=postgres java -jar target/apaar-verify-backend-1.0.0.jar
#
# The default (no profile) uses the zero-setup file-based H2 database so the
# demo runs anywhere with a single command. This profile switches the exact
# same JPA entities to PostgreSQL for institutional / cloud deployments.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:apaardb}
spring.datasource.username=${POSTGRES_USER:apaar}
spring.datasource.password=${POSTGRES_PASSWORD:apaar}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console is not needed (nor available) on PostgreSQL
spring.h2.console.enabled=false
