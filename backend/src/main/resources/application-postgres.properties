# Spring Boot PostgreSQL Profile
# Activate with: --spring.profiles.active=postgres or SPRING_PROFILES_ACTIVE=postgres

server.port=${PORT:8085}
spring.application.name=apaar-verify-backend

# PostgreSQL Connection Settings
# Supports environment variables DB_URL, Railway PGHOST/PGUSER/PGPASSWORD or individual POSTGRES_* overrides
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:${PGHOST:localhost}}:${POSTGRES_PORT:${PGPORT:5433}}/${POSTGRES_DB:${PGDATABASE:apaardb}}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:Ravan#666}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 console is disabled when on PostgreSQL
spring.h2.console.enabled=false

# Super Admin credentials
apaar.admin.email=${APAAR_ADMIN_EMAIL:admin@aicte.gov.in}
apaar.admin.password=${APAAR_ADMIN_PASSWORD:Aicte@2026}

# CORS
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:*}

# Kafka Event Broker Configuration (optional — excluded by default, no broker needed)
aicte.kafka.duplicate-topic=aicte.apaar.duplicate-events
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Logging
logging.level.gov.aicte=INFO
logging.level.org.springframework.security=WARN
