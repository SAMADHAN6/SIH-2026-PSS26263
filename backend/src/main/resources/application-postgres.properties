# Spring Boot PostgreSQL Profile
# Activate using: --spring.profiles.active=postgres or SPRING_PROFILES_ACTIVE=postgres

server.port=8085
spring.application.name=apaar-verify-backend

# PostgreSQL Connection Settings (Port 5433 from pgAdmin)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/apaardb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Ravan#666}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Kafka Event Broker Configuration
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
aicte.kafka.duplicate-topic=aicte.apaar.duplicate-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Logging
logging.level.gov.aicte=INFO
logging.level.org.springframework.security=WARN
