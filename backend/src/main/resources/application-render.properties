# Render production profile. All credentials and database coordinates are supplied
# as Render environment variables; there are intentionally no production defaults.
server.port=${PORT:8085}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

apaar.admin.email=${APAAR_ADMIN_EMAIL}
apaar.admin.password=${APAAR_ADMIN_PASSWORD}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS}
app.auth.google-login-enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
